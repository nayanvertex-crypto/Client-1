name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/
          retention-days: 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run security audit
        run: npm audit --audit-level=high

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Verify build output
        run: |
          ls -la dist/
          test -d dist/
          if [ -f dist/server/entry.mjs ]; then
            echo "✓ Verified SSR build output: dist/server/entry.mjs"
          elif [ -f dist/index.html ]; then
            echo "✓ Verified static build output: dist/index.html"
          elif [ -f dist/client/index.html ]; then
            echo "✓ Verified client build output: dist/client/index.html"
          else
            echo "✗ Error: No recognized build output found in dist/"
            exit 1
          fi
