<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="impl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2537"/>
      <stop offset="100%" stop-color="#163248"/>
    </linearGradient>
    <linearGradient id="ti-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="url(#impl-bg)"/>

  <!-- Jawbone Structure cross-section -->
  <path d="M50 320 Q300 280 550 320 L550 500 L50 500 Z" fill="#E2C0A5" opacity="0.3"/>
  <path d="M50 340 Q300 300 550 340 L550 500 L50 500 Z" fill="#D4A373" opacity="0.4"/>

  <!-- Central Implant Fixture (Titanium) -->
  <g transform="translate(250, 100)">
    <!-- Natural Tooth Shade Zirconia Crown -->
    <path d="M20 70 C10 40, 20 15, 50 15 C80 15, 90 40, 80 70 C75 85, 25 85, 20 70 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <ellipse cx="50" cy="25" rx="20" ry="6" fill="#F8FAFC"/>

    <!-- Abutment -->
    <polygon points="35,80 65,80 60,110 40,110" fill="url(#ti-grad)"/>

    <!-- Titanium Screw Threaded Fixture -->
    <rect x="38" y="110" width="24" height="150" rx="3" fill="url(#ti-grad)"/>
    <!-- Threads -->
    <line x1="30" y1="130" x2="70" y2="140" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="150" x2="70" y2="160" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="170" x2="70" y2="180" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="190" x2="70" y2="200" stroke="#475569" stroke-width="3"/>
    <line x1="30" y1="210" x2="70" y2="220" stroke="#475569" stroke-width="3"/>
    <polygon points="38,260 62,260 50,285" fill="url(#ti-grad)"/>

    <!-- Osseointegration Cellular Rays -->
    <circle cx="50" cy="180" r="70" fill="none" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="50" cy="180" r="90" fill="none" stroke="#25D366" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>
  </g>

  <!-- Labels & Metric Cards -->
  <g transform="translate(60, 400)">
    <rect width="480" height="60" rx="14" fill="#07131D" fill-opacity="0.85" stroke="#0D9488" stroke-width="1"/>
    <text x="20" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Titanium Fixture + Custom CAD/CAM Zirconia Crown</text>
    <text x="20" y="44" fill="#E6FFFA" font-family="system-ui, sans-serif" font-size="11">Computer-guided 3D placement · Lifelong bone preservation &amp; biting force</text>
  </g>
</svg>
