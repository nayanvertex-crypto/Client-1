<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="doc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="scrub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#doc-bg)"/>

  <!-- Subtle Medical Ambient Halo -->
  <circle cx="300" cy="240" r="180" fill="#E6FFFA" opacity="0.9"/>
  <circle cx="300" cy="240" r="140" fill="#0D9488" opacity="0.12"/>

  <!-- Doctor Silhouette & Clinical Scrubs -->
  <g transform="translate(150, 90)">
    <!-- Head & Neck -->
    <ellipse cx="150" cy="190" rx="35" ry="45" fill="#E2C0A5"/>
    <ellipse cx="150" cy="140" rx="65" ry="75" fill="#F0D3BC"/>

    <!-- Hair (Professional Dark Styled Cut) -->
    <path d="M85 130 C80 80, 110 50, 150 48 C195 48, 220 75, 215 130 C210 110, 195 90, 150 88 C115 90, 92 110, 85 130 Z" fill="#1E293B"/>

    <!-- Professional Glasses & Features -->
    <rect x="108" y="122" width="34" height="22" rx="6" fill="none" stroke="#0F2537" stroke-width="3"/>
    <rect x="158" y="122" width="34" height="22" rx="6" fill="none" stroke="#0F2537" stroke-width="3"/>
    <line x1="142" y1="130" x2="158" y2="130" stroke="#0F2537" stroke-width="3"/>

    <!-- Eyes (Warm & Friendly) -->
    <circle cx="125" cy="133" r="4" fill="#0F2537"/>
    <circle cx="175" cy="133" r="4" fill="#0F2537"/>

    <!-- Warm Reassuring Smile -->
    <path d="M130 172 Q150 190 170 172" fill="none" stroke="#9A3412" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M136 173 Q150 183 164 173" fill="#FFFFFF"/>

    <!-- Clinical Lab Coat / Scrubs -->
    <path d="M60 270 C80 230, 110 220, 150 220 C190 220, 220 230, 240 270 L280 430 L20 430 Z" fill="url(#scrub-grad)"/>

    <!-- White Inner Collar & Lapel -->
    <polygon points="125,220 150,285 175,220" fill="#FFFFFF"/>
    <polygon points="140,220 150,300 160,220" fill="#0F2537"/>

    <!-- Stethoscope / Implant Loupe Identifier -->
    <path d="M100 240 C100 320, 130 350, 150 350 C170 350, 200 320, 200 240" fill="none" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="355" r="14" fill="#0F2537" stroke="#0D9488" stroke-width="3"/>
  </g>

  <!-- Name & Credentials Overlay Card -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="480" height="85" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(15,37,55,0.06))"/>
    <text x="24" y="32" fill="#0F2537" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Dr. Ashish Uniyal, BDS, MDS</text>
    <text x="24" y="52" fill="#0D9488" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Oral &amp; Dental Surgeon · Chief Implantologist</text>
    <text x="24" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="500">HNB Medical University Alumni · State Regd. No-4135</text>
    <!-- Verified Badge -->
    <g transform="translate(420, 20)">
      <circle cx="16" cy="16" r="16" fill="#E6FFFA" stroke="#0D9488" stroke-width="1.5"/>
      <path d="M10 16 L14 20 L22 12" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
