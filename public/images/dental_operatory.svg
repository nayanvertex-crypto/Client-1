<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2537"/>
      <stop offset="50%" stop-color="#163954"/>
      <stop offset="100%" stop-color="#0A1824"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>

  <!-- Subtle Medical Cross Grid Pattern -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="2">
    <path d="M50 0v600M150 0v600M250 0v600M350 0v600M450 0v600M550 0v600M650 0v600M750 0v600"/>
    <path d="M0 75h800M0 175h800M0 275h800M0 375h800M0 475h800M0 575h800"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="280" r="220" fill="#0D9488" opacity="0.18" filter="blur(60px)"/>

  <!-- Operatory Architectural Frame -->
  <rect x="80" y="60" width="640" height="480" rx="24" fill="url(#glass-card)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Dental Stool & High-Tech Ergonomic Operatory Chair -->
  <g transform="translate(180, 120)">
    <!-- Base & Hydraulic Column -->
    <ellipse cx="220" cy="350" rx="90" ry="18" fill="#07131D" opacity="0.6"/>
    <rect x="210" y="240" width="20" height="110" rx="6" fill="#334155"/>
    <rect x="205" y="270" width="30" height="12" rx="4" fill="#0D9488"/>

    <!-- Chair Body Contour -->
    <path d="M120 250 C140 210, 200 230, 270 230 C320 230, 360 210, 370 240 C375 255, 350 270, 290 270 C210 270, 140 280, 120 250 Z" fill="#F8FAFC"/>
    <path d="M260 230 C270 170, 320 140, 350 130 C365 125, 375 135, 370 150 C360 180, 320 210, 270 230 Z" fill="#0D9488"/>
    <!-- Headrest -->
    <rect x="345" y="110" width="45" height="25" rx="8" fill="#F8FAFC"/>

    <!-- Overhead Dual-Arm Dental Shadowless LED Light -->
    <path d="M100 320 L100 100 L180 80 L230 110" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="10" fill="#0D9488"/>
    <circle cx="180" cy="80" r="8" fill="#0D9488"/>
    <!-- Light Head -->
    <g transform="translate(230, 110)">
      <ellipse cx="0" cy="0" rx="35" ry="18" fill="#FFFFFF"/>
      <ellipse cx="0" cy="0" rx="28" ry="12" fill="#E6FFFA"/>
      <!-- Soft Light Beam Cone -->
      <polygon points="-25,12 25,12 70,180 -70,180" fill="#E6FFFA" opacity="0.12"/>
    </g>

    <!-- Digital RVG Monitor Screen -->
    <g transform="translate(340, 60)">
      <rect x="0" y="0" width="130" height="90" rx="10" fill="#07131D" stroke="#0D9488" stroke-width="2"/>
      <rect x="6" y="6" width="118" height="78" rx="6" fill="#0F2537"/>
      <!-- 3D Tooth X-Ray Scan Silhouette -->
      <path d="M50 25 C45 35, 40 50, 48 65 C52 70, 56 60, 60 52 C64 60, 68 70, 72 65 C80 50, 75 35, 70 25 C64 22, 56 22, 50 25 Z" fill="#E6FFFA" opacity="0.85"/>
      <path d="M56 35 L64 35 M58 45 L62 45" stroke="#0D9488" stroke-width="2"/>
      <circle cx="108" cy="18" r="4" fill="#25D366"/>
      <text x="12" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">RVG 3D · 90% LESS RAD</text>
    </g>
  </g>

  <!-- Trust Badge Banner at Bottom -->
  <g transform="translate(130, 470)">
    <rect x="0" y="0" width="540" height="48" rx="14" fill="#07131D" fill-opacity="0.8" stroke="#0D9488" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Verified Shield Icon -->
    <g transform="translate(20, 14)">
      <path d="M10 0 L20 4 L20 11 C20 16 10 20 10 20 C10 20 0 16 0 11 L0 4 Z" fill="#0D9488"/>
      <path d="M6 10 L9 13 L15 7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="50" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">UNIYAL ORO DENTAL CLINIC &amp; IMPLANT CENTRE</text>
    <text x="50" y="38" fill="#E6FFFA" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Class-B Autoclave Sterilization · Near Malsi Puliya, Balawala, Dehradun</text>
    <!-- 4.8 Rating Stars -->
    <text x="440" y="30" fill="#D97706" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">★★★★★ 4.8</text>
  </g>
</svg>
