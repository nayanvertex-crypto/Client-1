<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ali-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="url(#ali-bg)"/>

  <!-- Dental Arch Silhouette -->
  <g transform="translate(100, 100)">
    <!-- Natural Dental Arch Curve -->
    <path d="M50 240 C60 100, 150 40, 200 40 C250 40, 340 100, 350 240" fill="none" stroke="#E2E8F0" stroke-width="60" stroke-linecap="round"/>

    <!-- Perfectly Aligned Teeth -->
    <!-- Central Incisors -->
    <rect x="180" y="25" width="18" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="202" y="25" width="18" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Lateral Incisors -->
    <rect x="160" y="32" width="16" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="224" y="32" width="16" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Canines -->
    <rect x="140" y="45" width="16" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="244" y="45" width="16" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Premolars -->
    <rect x="118" y="70" width="18" height="25" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="264" y="70" width="18" height="25" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="100" y="105" width="18" height="25" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="282" y="105" width="18" height="25" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Molars -->
    <rect x="85" y="145" width="22" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="295" y="145" width="22" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="70" y="185" width="24" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="308" y="185" width="24" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Transparent Medical Polymer Clear Aligner Overlay Sheath -->
    <path d="M45 240 C55 95, 148 30, 200 30 C252 30, 345 95, 355 240" fill="none" stroke="#0D9488" stroke-width="3" opacity="0.8" stroke-dasharray="8 4"/>
    <path d="M45 240 C55 95, 148 30, 200 30 C252 30, 345 95, 355 240" fill="none" stroke="#38BDF8" stroke-width="8" opacity="0.3"/>
  </g>

  <!-- Feature Badge Card -->
  <g transform="translate(60, 390)">
    <rect width="480" height="70" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 6px 14px rgba(15,37,55,0.05))"/>
    <text x="24" y="28" fill="#0F2537" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Digital Invisible Clear Aligners</text>
    <text x="24" y="48" fill="#0D9488" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3D Intraoral Scanned · Removable for Meals &amp; Brushing · No Metal Wires</text>
  </g>
</svg>
